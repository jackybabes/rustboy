[package]
name = "rustboy"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["web"]

# The desktop window is native-only; the lib itself has no dependencies, so it
# compiles to wasm32 for the web frontend in `web/`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.28.0"

# The test ROMs execute tens of millions of instructions; optimize test builds
# so `cargo test` finishes in seconds rather than minutes. Debug builds
# (`cargo build`, the debugger) are left unoptimized.
[profile.test]
opt-level = 3
